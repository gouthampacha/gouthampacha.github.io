- title: "The Blue Screen of Ceph: An SMB Experiment in OpenStack Manila"
  event: "Ceph Days Chicago 2026"
  location: "Chicago, IL"
  date: 2026-11-17
  speakers: ["Goutham Pacha Ravi"]
  type: "talk"
  url: "https://ceph.io/en/community/events/2026/ceph-days-chicago/"
  slides: "/decks/blue-screen-of-ceph/"
  abstract: "Whether Ceph Tentacle's integrated SMB manager and OpenStack Manila's CephFS driver can form a secure, recoverable CIFS/SMB backend: reconciling three independent control planes without exposing data or creating unrecoverable drift. An architectural experiment, presented with its sharp edges intact."

- title: "Supercomputing on Demand"
  event: "OpenInfra Days North America 2026"
  location: "Chicago, IL"
  date: 2026-11-17
  speakers: ["Goutham Pacha Ravi"]
  type: "talk"
  url: "https://openinfra.org/days/northamerica/"
  slides: "/decks/supercomputing-on-demand/"
  abstract: "Lustre, the filesystem behind national labs, as a self-service cloud primitive through Manila: quotas, access rules, and lifecycle management that HPC sites otherwise build by hand. With a live demo of an AI training run against the Lustre driver."

- title: "Closing the CephFS Trust Gap"
  event: "OpenInfra Days North America 2026"
  location: "Chicago, IL"
  date: 2026-11-17
  speakers: ["Goutham Pacha Ravi"]
  type: "talk"
  url: "https://openinfra.org/days/northamerica/"
  slides: "/decks/closing-the-cephfs-trust-gap/"
  abstract: "virtiofs moves the trust boundary to the hypervisor: the guest gets no storage credentials or Ceph access, while the compute host mounts the share and passes it to the VM over virtqueues. The Manila and Nova integration, its Epoxy-release constraints, and four specs targeting the gaps."

